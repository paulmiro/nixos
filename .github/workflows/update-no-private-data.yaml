name: Update no-private-data branch

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  update:
    runs-on: [ubuntu-latest]

    concurrency:
      group: "update-no-private-data"
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update no-private-data Branch
        run: |
          git checkout -B no-private-data origin/main
          echo true > modules/private/allow_fake.nix
          git add modules/private/allow_fake.nix
          git commit -m "allow fake private data"
          git push origin no-private-data --force
