depends_on: []
labels:
  backend: local
  platform: linux/amd64
steps:
  - commands:
      - cd modules/private
      - echo $AGE_KEY_PRIVATE_DATA | nix shell nixpkgs#age --command age --decrypt -i - -o private.toml.decrypted private.toml
      - mv private.toml.decrypted private.toml
    environment:
      AGE_KEY_PRIVATE_DATA:
        from_secret: AGE_KEY_PRIVATE_DATA
    image: bash
    name: Decrypt Private Data
  - commands:
      - attic login lounge-rocks https://cache.lounge.rocks $ATTIC_KEY --set-default
    environment:
      ATTIC_KEY:
        from_secret: attic_key
    image: bash
    name: Setup Attic
  - commands:
      - nix-fast-build --no-nom --skip-cached --attic-cache lounge-rocks:nix-cache --option warn-dirty false --result-file result.json --flake ".#ci.x86_64-linux"
    failure: ignore
    image: bash
    name: Build all x86_64-linux machines
  - commands:
      - cat result.json | jq -e '.results | map(select(.attr == "backus")) | all(.success)'
    failure: ignore
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-output-backus
  - commands:
      - cat result.json | jq -e '.results | map(select(.attr == "hawking")) | all(.success)'
    failure: ignore
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-output-hawking
  - commands:
      - cat result.json | jq -e '.results | map(select(.attr == "leibniz")) | all(.success)'
    failure: ignore
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-output-leibniz
  - commands:
      - cat result.json | jq -e '.results | map(select(.attr == "morse")) | all(.success)'
    failure: ignore
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-output-morse
  - commands:
      - cat result.json | jq -e '.results | map(select(.attr == "newton")) | all(.success)'
    failure: ignore
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-output-newton
  - commands:
      - cat result.json | jq -e '.results | map(select(.attr == "turing")) | all(.success)'
    failure: ignore
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-output-turing
when:
  branch:
    exclude:
      - no-private-data
    include:
      - '**'
  event:
    - push
