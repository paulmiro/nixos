depends_on:
  - build-all-x86_64-linux
labels:
  backend: local
  platform: linux/amd64
skip_clone: true
steps:
  - commands:
      - curl -sv $CI_SYSTEM_URL/api/repos/$CI_REPO_ID/pipelines/$CI_PIPELINE_NUMBER | jq -e '.workflows[] | select(.name == "build-all-x86_64-linux") .children[] | select(.name == "check-output-newton") .state == "success"'
    image: bash
    name: check-newton-status
when:
  branch:
    exclude:
      - no-private-data
    include:
      - '**'
  event:
    - push
  status:
    - success
    - failure
