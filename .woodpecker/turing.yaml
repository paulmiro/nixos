depends_on:
  - build-all-x86_64-linux
labels:
  backend: docker
  platform: linux/amd64
skip_clone: true
steps:
  - commands:
      - curl -s $CI_SYSTEM_URL/api/repos/$CI_REPO_ID/pipelines/$CI_PIPELINE_NUMBER | jq -e '.workflows[] | select(.name == "build-all-x86_64-linux") .children[] | select(.name == "check-output-turing") .state == "success"'
    image: registry.gitlab.com/gitlab-ci-utils/curl-jq:latest
    name: check-turing-status
when:
  branch:
    exclude:
      - no-private-data
    include:
      - '**'
  event:
    - push
  status:
    - success
    - failure
